# Mirrors the Hearts dev workflow, on its own port and dependency volume.
# npm run up:build
services:
  web:
    image: euchre-web-dev:local
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
      VITE_ACCOUNT_API_URL: ${VITE_ACCOUNT_API_URL:-}
      ACCOUNT_PROXY_TARGET: ${ACCOUNT_PROXY_TARGET:-}
    command: npm run dev -- --host 0.0.0.0
    restart: "no"

volumes:
  web_node_modules:
    name: euchre_web_node_modules
