server {
    listen 3002;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    if ($uri ~ "(^|/)_internal(/|$)") { return 404; }
# Reject nested path escapes before a second proxy can decode them again.
if ($uri ~* "%[0-9a-f]{2}") { return 404; }

    # Unknown API paths must not return the SPA with a misleading 200 status.
    # Cards routes the public /api/ paths directly to the shared API.
    location ^~ /api/ {
        default_type application/json;
        return 503 '{"error":"Shared accounts are not connected yet"}';
    }
    location ~ ^/(?:euchre/)?socket\.io/?$ {
        default_type application/json;
        return 503 '{"error":"The shared multiplayer service is not connected"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-cache';
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    location ~ /\. { return 404; }
    location ~* \.(?:js|css|svg|png|jpe?g|webp|ico|ttf|woff2?|mp3|ogg|json|txt)$ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=3600';
    }
}
