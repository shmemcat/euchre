server {
    listen 3002;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Unknown API paths must not return the SPA with a misleading 200 status.
    # The future hub will route /api/account to the shared account service.
    location /api/ {
        default_type application/json;
        return 503 '{"error":"Shared accounts are not connected yet"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-cache';
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    location ~* \.(svg|ttf|mp3)$ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=3600';
    }
}
