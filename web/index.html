<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="theme-color" content="#26364f" />
      <meta
         name="description"
         content="Play the classic card game ♣️ Call trump, take tricks, or go alone 🃏"
      />
      <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=2" />
      <link
         rel="preload"
         href="%BASE_URL%fonts/EBGaramond-Variable.ttf"
         as="font"
         type="font/ttf"
         crossorigin
      />
      <title>Euchre</title>

      <!-- Open Graph -->
      <meta property="og:type" content="website" />
      <meta property="og:title" content="Euchre" />
      <meta property="og:site_name" content="Cards" />
      <meta property="og:url" content="https://cards.shmem.dev/euchre/" />
      <meta
         property="og:description"
         content="Play the classic card game ♣️ Call trump, take tricks, or go alone 🃏"
      />
      <meta
         property="og:image"
         content="https://cards.shmem.dev/euchre/images/og-image.png?v=card-rendering"
      />
      <meta property="og:image:type" content="image/png" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta
         property="og:image:alt"
         content="Euchre in ivory over a muted blue moon and stars on a navy background."
      />

      <!-- Twitter Card -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Euchre" />
      <meta
         name="twitter:description"
         content="Play the classic card game ♣️ Call trump, take tricks, or go alone 🃏"
      />
      <meta
         name="twitter:image"
         content="https://cards.shmem.dev/euchre/images/og-image.png?v=card-rendering"
      />
      <meta
         name="twitter:image:alt"
         content="Euchre in ivory over a muted blue moon and stars on a navy background."
      />

      <script>
         // Apply the same preference as ThemeProvider before the first paint.
         (function () {
            var stored;
            try {
               stored = JSON.parse(localStorage.getItem("cards.theme.v1"));
            } catch (e) {}
            var theme =
               stored === "light" || stored === "dark"
                  ? stored
                  : window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light";
            document.documentElement.dataset.theme = theme;
         })();
      </script>
   </head>
   <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
   </body>
</html>
