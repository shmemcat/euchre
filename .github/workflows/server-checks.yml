name: Check standalone Euchre server

on:
  pull_request:
    paths: ["api/**", "web/src/game/engine.ts", "scripts/check-multiplayer-engine.mjs", "release/**", "scripts/component-release*.mjs", ".github/workflows/server-checks.yml", ".github/workflows/game-release.yml"]
  push:
    paths: ["api/**", "web/src/game/engine.ts", "scripts/check-multiplayer-engine.mjs", "release/**", "scripts/component-release*.mjs", ".github/workflows/server-checks.yml", ".github/workflows/game-release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: "3.11"
      - name: Test the independent backend
        working-directory: api
        run: |
          uv sync --locked --extra dev
          uv run --locked --extra dev pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare browser and independent server rules
        run: npm run test:multiplayer-rules
      - run: node --test scripts/component-release.test.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Build the independent game image without sibling checkouts
        uses: docker/build-push-action@v6
        with:
          context: api
          load: true
          tags: euchre-game-api:check
          build-args: |
            REVISION=${{ github.sha }}
      - name: Check independent image imports and registrations
        run: |
          docker run --rm euchre-game-api:check python -c "import sys; from euchre_server import create_app; app=create_app({'SQLALCHEMY_DATABASE_URI':'sqlite://', 'CARDS_PUBLIC_URL':'http://localhost:3000', 'CARDS_ACCOUNTS_URL':'http://accounts.invalid', 'CARDS_SERVICE_TOKEN':'r'*40, 'GAME_ACCOUNT_TOKENS':{'euchre':'c'*40}}); assert set(app.extensions['socketio'].server.handlers)=={'/euchre'}; assert not any(m.split('.')[0] in {'hearts','cards_accounts','argon2','jwt'} for m in sys.modules)"
